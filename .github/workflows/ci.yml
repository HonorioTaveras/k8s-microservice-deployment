name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  test-lint-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff auto-fix
        run: |
          ruff check app --fix
          # Optional: show what changed
          git status --porcelain
          git diff --patch --minimal -- app || true

      - name: Enforce no uncommitted changes after auto-fix
        run: |
          if ! git diff --quiet; then
            echo "Ruff formatted files. Please run 'ruff check app --fix' locally and commit the changes."
            exit 1
          fi

      - name: Type check
        run: mypy app

      - name: Test
        run: |
          pytest -q --maxfail=1 --disable-warnings

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: my-k8s-app:ci
