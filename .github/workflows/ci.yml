name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# IMPORTANT: need write perms to push the auto-fix commit
permissions:
  contents: write
  packages: write

jobs:
  test-lint-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # leave default persist-credentials: true so can push
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 1) Auto-fix with Ruff
      - name: Ruff auto-fix
        run: ruff check app --fix

      # 2) If Ruff changed files, commit back to the same branch, skipping CI to avoid loops
      - name: Commit auto-fixes (if any)
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "ci(format): ruff auto-fix [skip ci]"
            git push
          else
            echo "No formatting changes to commit."
          fi

      # From here on, repo is in its auto-formatted state
      - name: Type check
        run: mypy app

      - name: Test
        run: pytest -q --maxfail=1 --disable-warnings

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: my-k8s-app:ci
